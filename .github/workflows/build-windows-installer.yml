name: CRT Terminal Signed Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - '.github/workflows/crt-terminal-ci.yml'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'mt5-bridge/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crt-terminal-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build single NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Require signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before publishing updates.' }

      - name: Build signed CRT Terminal installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run app:build -- --bundles nsis

      - name: Prepare signed update manifest
        run: node scripts/prepare-update-release.mjs

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "v$releaseVersion"
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $releaseTag already exists; increment app version. Published releases must not be replaced." }
          gh release create $releaseTag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "CRT Terminal $releaseVersion" --notes-file docs/current-release.md
          if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed' }
          $releaseFiles = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe,src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig | ForEach-Object { $_.FullName })
          gh release upload $releaseTag @releaseFiles .smartflow-runtime/release/latest.json --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit $releaseTag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }


      - name: Publish installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: CRT-Terminal-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          retention-days: 30
