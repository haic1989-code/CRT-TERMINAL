name: CRT Terminal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: crt-terminal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Test MT5 bridge logic
        run: python3 -m unittest discover -s mt5-bridge/tests

      - name: Check MT5 bridge syntax
        run: python3 -m py_compile mt5-bridge/bridge.py

      - name: Install Chromium for visual tests
        run: npx playwright install --with-deps chromium

      - name: Run Matrix CRT visual tests
        run: npm run test:visual

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crt-terminal-approved-shell-${{ github.sha }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 7
