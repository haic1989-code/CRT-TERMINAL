name: CRT Terminal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: crt-terminal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Run unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Install replay array dependency
        run: |
          python3 -m venv .smartflow-runtime/ci-python
          .smartflow-runtime/ci-python/bin/python -m pip install numpy==2.5.3

      - name: Test MT5 bridge logic
        run: .smartflow-runtime/ci-python/bin/python -m unittest discover -s mt5-bridge/tests

      - name: Check MT5 bridge syntax
        run: .smartflow-runtime/ci-python/bin/python -m py_compile mt5-bridge/bridge.py mt5-bridge/execution.py mt5-bridge/quotes.py mt5-bridge/replay_import_worker.py mt5-bridge/replay_ticks.py mt5-bridge/replay_store.py mt5-bridge/replay_worker.py mt5-bridge/replay_finance.py

      - name: Install Chromium for visual tests
        run: npx playwright install --with-deps chromium

      - name: Run Matrix CRT visual tests
        run: npm run test:visual

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crt-terminal-approved-shell-${{ github.sha }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 7
